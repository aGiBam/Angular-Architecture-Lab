name: Deploy Angular App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Angular Application
        run: npx ng build --configuration production --base-href /Angular-Architecture-Lab/

      - name: Prepare SPA Fallback (404.html)
        run: |
          if [ -d "dist/angular-architecture-lab/browser" ]; then
            TARGET_DIR="dist/angular-architecture-lab/browser"
          else
            TARGET_DIR="dist/angular-architecture-lab"
          fi
          echo "Discovered build target directory: $TARGET_DIR"
          cp "$TARGET_DIR/index.html" "$TARGET_DIR/404.html"
          echo "DEPLOY_PATH=$TARGET_DIR" >> $GITHUB_ENV

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: ${{ env.DEPLOY_PATH }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
